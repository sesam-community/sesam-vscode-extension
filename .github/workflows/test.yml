name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    types: [closed]
    branches: ["**"]

# Only run the merge trigger when the PR was actually merged (not just closed)
env:
  SKIP_IF_UNMERGED: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == false }}

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Skip if PR closed without merging
        if: env.SKIP_IF_UNMERGED == 'true'
        run: echo "PR was closed without merging — skipping." && exit 0

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter vscode-extension test
