name: Release Extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-extension:
    name: Build & publish VSIX
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter dtl-language-support test

      - name: Build extension
        run: pnpm --filter dtl-language-support build

      - name: Package VSIX
        run: pnpm --filter dtl-language-support exec vsce package --no-dependencies --skip-license --out ${{ github.workspace }}/sesam-${{ github.ref_name }}.vsix

      - name: Bundle installer archive
        run: |
          mkdir -p sesam-installer
          cp ${{ github.workspace }}/sesam-${{ github.ref_name }}.vsix sesam-installer/
          cp scripts/sesam-install.sh sesam-installer/
          tar -czf sesam-installer-${{ github.ref_name }}.tar.gz sesam-installer/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sesam-installer-${{ github.ref_name }}.tar.gz
            ${{ github.workspace }}/sesam-${{ github.ref_name }}.vsix
          generate_release_notes: true
