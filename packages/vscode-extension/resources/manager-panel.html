<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sesam Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--vscode-titleBar-activeBackground, var(--vscode-sideBar-background));
      border-bottom: 1px solid var(--vscode-panel-border);
      flex-shrink: 0;
    }

    .toolbar h2 {
      font-size: 13px;
      font-weight: 600;
      margin-right: auto;
    }

    /* ── content ── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    /* ── action buttons ── */
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--vscode-button-secondaryBackground);
      color: var(--vscode-button-secondaryForeground);
      border: none;
      border-radius: 2px;
      font-size: var(--vscode-font-size);
      font-family: var(--vscode-font-family);
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn:hover:not(:disabled) {
      background: var(--vscode-button-secondaryHoverBackground);
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .action-btn.primary {
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border-radius: 4px;
    }

    .action-btn.primary:hover:not(:disabled) {
      background: var(--vscode-button-hoverBackground);
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      opacity: 0.55;
      padding: 10px 0 2px;
    }

    .section-label:first-child {
      padding-top: 0;
    }

    .busy-banner {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--vscode-inputValidation-infoBackground, #003366);
      border-bottom: 1px solid var(--vscode-inputValidation-infoBorder, #007acc);
      font-size: 12px;
      flex-shrink: 0;
    }

    .busy-banner.visible {
      display: flex;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h2>Sesam Manager</h2>
  </div>

  <div class="busy-banner" id="busyBanner">
    <span class="spin">⟳</span>
    <span>Transfer in progress…</span>
  </div>

  <div class="content">
    <div class="section-label">Configs</div>

    <button class="action-btn primary" id="btnUpload" onclick="send('upload')">
      ↑ Upload
    </button>

    <button class="action-btn primary" id="btnDownload" onclick="send('download')">
      ↓ Download
    </button>

    <div class="section-label">Status</div>

    <button class="action-btn primary" id="btnNodeStatus" onclick="send('nodeStatus')">
      ⬡ Node Status
    </button>

    <button class="action-btn primary" id="btnSystemStatus" onclick="send('systemStatus')">
      ≡ System Status
    </button>
  </div>

  <script>
    const vscode = acquireVsCodeApi();

    function send(command) {
      vscode.postMessage({ type: 'command', command });
    }

    let transferInProgress = false;

    function applyState(inProgress) {
      transferInProgress = inProgress;
      const busy = document.getElementById('busyBanner');
      const upload = document.getElementById('btnUpload');
      const download = document.getElementById('btnDownload');

      if (inProgress) {
        busy.classList.add('visible');
        upload.disabled = true;
        download.disabled = true;
      } else {
        busy.classList.remove('visible');
        upload.disabled = false;
        download.disabled = false;
      }
    }

    window.addEventListener('message', (event) => {
      const msg = event.data;

      if (msg.type === 'state') {
        applyState(msg.transferInProgress);
      }
    });

    // Signal ready
    vscode.postMessage({ type: 'ready' });
  </script>
</body>
</html>
