<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
  <title>Node Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: codicon;
      src: url("{{codiconFontUri}}") format("truetype");
    }

    .codicon {
      font-family: codicon;
      font-size: 14px;
      line-height: 1;
      speak: never;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .codicon-arrow-up::before    { content: "\eaa1"; }
    .codicon-arrow-down::before  { content: "\ea9a"; }
    .codicon-server::before      { content: "\eb50"; }
    .codicon-database::before    { content: "\eace"; }

    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--vscode-titleBar-activeBackground, var(--vscode-sideBar-background));
      border-bottom: 1px solid var(--vscode-panel-border);
      flex-shrink: 0;
    }

    .toolbar h2 {
      font-size: 13px;
      font-weight: 600;
      margin-right: auto;
    }

    /* ── busy banner ── */
    .busy-banner {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--vscode-inputValidation-infoBackground, #003366);
      border-bottom: 1px solid var(--vscode-inputValidation-infoBorder, #007acc);
      font-size: 12px;
      flex-shrink: 0;
    }

    .busy-banner.visible { display: flex; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 1s linear infinite; }

    /* ── content ── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── section label ── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      opacity: 0.55;
      padding: 8px 0 2px;
    }

    .section-label:first-child { padding-top: 0; }

    /* ── button group (horizontal) ── */
    .btn-group {
      display: flex;
      flex-direction: row;
      gap: 6px;
    }

    /* ── action buttons ── */
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border: none;
      border-radius: 4px;
      font-size: var(--vscode-font-size);
      font-family: var(--vscode-font-family);
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn:hover:not(:disabled) {
      background: var(--vscode-button-hoverBackground);
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <h2>Node Management</h2>
  </div>

  <div class="busy-banner" id="busyBanner">
    <span class="spin">⟳</span>
    <span>Transfer in progress…</span>
  </div>

  <div class="content">
    <div class="section-label">Configs</div>

    <div class="btn-group">
      <button class="action-btn" id="btnUpload" onclick="send('upload')" title="Upload all local configs to the node">
        <span class="codicon codicon-arrow-up"></span> Upload
      </button>
      <button class="action-btn" id="btnDownload" onclick="send('download')" title="Download all configs from the node">
        <span class="codicon codicon-arrow-down"></span> Download
      </button>
    </div>

    <div class="section-label">Status</div>

    <div class="btn-group">
      <button class="action-btn" id="btnNodeStatus" onclick="send('nodeStatus')" title="Open the pipes status panel">
        <span class="codicon codicon-server"></span> Pipes Status
      </button>
      <button class="action-btn" id="btnSystemStatus" onclick="send('systemStatus')" title="Open system status overview">
        <span class="codicon codicon-database"></span> System Status
      </button>
    </div>
  </div>

  <script>
    const vscode = acquireVsCodeApi();

    function send(command) {
      vscode.postMessage({ type: 'command', command });
    }

    function applyState(inProgress, provisioning) {
      const busy = document.getElementById('busyBanner');
      const upload = document.getElementById('btnUpload');
      const download = document.getElementById('btnDownload');
      const nodeStatus = document.getElementById('btnNodeStatus');
      const systemStatus = document.getElementById('btnSystemStatus');

      const blocked = inProgress || provisioning;

      busy.classList.toggle('visible', inProgress);
      upload.disabled = blocked;
      download.disabled = blocked;
      nodeStatus.disabled = blocked;
      systemStatus.disabled = blocked;
    }

    window.addEventListener('message', (event) => {
      const msg = event.data;

      if (msg.type === 'state') {
        applyState(msg.transferInProgress, msg.nodeProvisioning);
      }
    });

    vscode.postMessage({ type: 'ready' });
  </script>
</body>
</html>
